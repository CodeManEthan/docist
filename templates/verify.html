<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docist &mdash; Verify your email</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="/static/style.css">
    {% include "_csrf_head.html" %}
</head>
<body>
    <nav class="tool-nav">
        <span class="nav-brand">Docist</span>
        <a href="/">Merge</a>
        <a href="/convert">Convert Files</a>
        <a href="/pages">Page Tools</a>
        <a href="/print">Print Prep</a>
        <a href="/export">Export</a>
        <a href="/security">Watermark &amp; Security</a>
        <a href="/api">API</a>
        {% include "_account_nav.html" %}
    </nav>
    <div class="container login-container">
        <h1><span class="h1-icon"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><defs><linearGradient id="h1-grad" gradientUnits="userSpaceOnUse" x1="2" y1="2" x2="22" y2="22"><stop offset="0" stop-color="#ff8a3d"/><stop offset="0.5" stop-color="#ff4d5e"/><stop offset="1" stop-color="#ff5fa8"/></linearGradient></defs><g fill="none" stroke="url(#h1-grad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></g></svg></span>Verify your email</h1>
        <p class="subtitle">Confirm that you signed up for Docist with {{ email }}.</p>

        <form method="post" action="/verify/{{ token }}" class="login-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="btn">Verify my email</button>
        </form>
        <p class="auth-links">If you didn't sign up, close this page and nothing happens.</p>
    </div>
</body>
</html>
