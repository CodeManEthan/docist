<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docist &mdash; Sign in</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container login-container">
        <h1>📄 Docist</h1>
        {% if shown_password %}
        <p class="subtitle">This is a public demo. The password is printed below; it keeps bots out, not you.</p>
        <p class="login-demo">Password: <code>{{ shown_password }}</code></p>
        {% else %}
        <p class="subtitle">This instance is private. Enter the access password to continue.</p>
        {% endif %}

        {% if error %}
        <p class="login-error">{{ error }}</p>
        {% endif %}

        <form method="post" action="/login" class="login-form">
            <input type="hidden" name="next" value="{{ next }}">
            <input type="password" name="password" placeholder="Password"
                   value="{{ shown_password }}"
                   autofocus autocomplete="current-password" required>
            <button type="submit" class="btn">Sign in</button>
        </form>
    </div>
</body>
</html>
