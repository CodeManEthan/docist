<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docist &mdash; Choose a new password</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="/static/style.css">
    {% include "_csrf_head.html" %}
</head>
<body>
    <nav class="tool-nav">
        <span class="nav-brand">Docist</span>
        <a href="/">Merge</a>
        <a href="/convert">Convert Files</a>
        <a href="/pages">Page Tools</a>
        <a href="/print">Print Prep</a>
        <a href="/export">Export</a>
        <a href="/security">Watermark &amp; Security</a>
        <a href="/api">API</a>
        {% include "_account_nav.html" %}
    </nav>
    <div class="container login-container">
        <h1><span class="h1-icon"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><defs><linearGradient id="h1-grad" gradientUnits="userSpaceOnUse" x1="2" y1="2" x2="22" y2="22"><stop offset="0" stop-color="#ff8a3d"/><stop offset="0.5" stop-color="#ff4d5e"/><stop offset="1" stop-color="#ff5fa8"/></linearGradient></defs><g fill="none" stroke="url(#h1-grad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="m10.8 12.2 9.2-9.2"/><path d="m17 6 3 3"/><path d="m14 9 2 2"/></g></svg></span>Choose a new password</h1>
        <p class="subtitle">Saving it signs out every session and revokes your API keys.</p>

        {% if error %}
        <p class="login-error">{{ error }}</p>
        {% endif %}

        <form method="post" action="/reset/{{ token }}" class="login-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="password" name="password" placeholder="New password (at least 8 characters)"
                   autofocus autocomplete="new-password" minlength="8" maxlength="256" required>
            <input type="password" name="confirm" placeholder="Confirm new password"
                   autocomplete="new-password" minlength="8" maxlength="256" required>
            <button type="submit" class="btn">Set password</button>
        </form>
    </div>
</body>
</html>
