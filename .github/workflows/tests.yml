name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # The system packages the suite uses, taken from the Dockerfile:
      # tesseract-ocr and ghostscript run OCR (ocrmypdf, pytesseract),
      # tesseract-ocr-spa lets the Spanish read-back test run, and
      # fonts-liberation gives the OCR fixtures a TrueType font.
      # LibreOffice runs the Word engine: one archive test fails without it
      # rather than skipping. Carlito and Caladea let its font test run.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr \
            tesseract-ocr-spa \
            ghostscript \
            fonts-liberation \
            libreoffice-writer-nogui \
            fonts-crosextra-carlito \
            fonts-crosextra-caladea

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest tests -q

  node:
    name: node --test (Node 22)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run the front-end tests
        run: node --test tests/frontend/*.test.js
